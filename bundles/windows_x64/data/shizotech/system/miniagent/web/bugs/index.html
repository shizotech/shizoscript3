<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bug Tracker • ShizoGPT Dashboard</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../components/ui.css" />
  <link rel="stylesheet" href="../components/theme.css" />
</head>
<body>
  <div class="bugs-container">
    <!-- Header -->
    <div class="bugs-header">
      <div class="header-content">
        <h1 class="bugs-title">
          <i class="fa-solid fa-bug"></i>
          Bug Tracker
        </h1>
        <div class="bugs-meta">
          <span class="bug-count" id="bugCount">0</span> bugs tracked
        </div>
      </div>
      
      <div class="header-actions">
        <button class="ui-btn ui-btn-secondary" id="btnFilter">
          <i class="fa-solid fa-filter"></i>
          Filter
        </button>
        <button class="ui-btn" id="btnAddBug">
          <i class="fa-solid fa-plus"></i>
          Report Bug
        </button>
      </div>
    </div>

    <!-- Filters -->
    <div class="bugs-filters">
      <div class="filter-group">
        <label>Status</label>
        <div class="filter-chips" id="statusFilter">
          <button class="ui-filter-chip active" data-status="all">
            <i class="fa-solid fa-list ui-filter-chip-icon"></i>
            All
          </button>
          <button class="ui-filter-chip" data-status="new">
            <i class="fa-solid fa-bell ui-filter-chip-icon"></i>
            New
          </button>
          <button class="ui-filter-chip" data-status="investigating">
            <i class="fa-solid fa-search ui-filter-chip-icon"></i>
            Investigating
          </button>
          <button class="ui-filter-chip" data-status="fixing">
            <i class="fa-solid fa-wrench ui-filter-chip-icon"></i>
            Fixing
          </button>
          <button class="ui-filter-chip" data-status="verified">
            <i class="fa-solid fa-check-circle ui-filter-chip-icon"></i>
            Verified
          </button>
          <button class="ui-filter-chip" data-status="closed">
            <i class="fa-solid fa-xmark ui-filter-chip-icon"></i>
            Closed
          </button>
        </div>
      </div>
      
      <div class="filter-group">
        <label>Priority</label>
        <div class="filter-chips" id="priorityFilter">
          <button class="ui-filter-chip active" data-priority="all">
            <i class="fa-solid fa-list ui-filter-chip-icon"></i>
            All
          </button>
          <button class="ui-filter-chip" data-priority="low">
            <i class="fa-solid fa-circle ui-filter-chip-icon"></i>
            Low
          </button>
          <button class="ui-filter-chip" data-priority="medium">
            <i class="fa-solid fa-dot-circle ui-filter-chip-icon"></i>
            Medium
          </button>
          <button class="ui-filter-chip" data-priority="high">
            <i class="fa-solid fa-circle-exclamation ui-filter-chip-icon"></i>
            High
          </button>
          <button class="ui-filter-chip" data-priority="critical">
            <i class="fa-solid fa-triangle-exclamation ui-filter-chip-icon"></i>
            Critical
          </button>
        </div>
      </div>
      
      <div class="filter-group">
        <label>Source</label>
        <div class="filter-chips" id="sourceFilter">
          <button class="ui-filter-chip active" data-source="all">
            <i class="fa-solid fa-list ui-filter-chip-icon"></i>
            All
          </button>
          <button class="ui-filter-chip" data-source="user">
            <i class="fa-solid fa-user ui-filter-chip-icon"></i>
            User
          </button>
          <button class="ui-filter-chip" data-source="testing">
            <i class="fa-solid fa-flask ui-filter-chip-icon"></i>
            Testing
          </button>
          <button class="ui-filter-chip" data-source="monitoring">
            <i class="fa-solid fa-eye ui-filter-chip-icon"></i>
            Monitoring
          </button>
        </div>
      </div>
    </div>

    <!-- Bug Grid -->
    <div class="bug-grid ui-grid" id="bugGrid">
      <!-- Bugs will be rendered here -->
    </div>

    <!-- Empty State -->
    <div class="empty-state ui-empty-state" id="emptyState" style="display: none;">
      <div class="empty-state-icon"><i class="fa-solid fa-bug"></i></div>
      <h2 class="empty-state-title">No Bugs Found</h2>
      <p class="empty-state-desc">All systems nominal! Report any issues you encounter to track them.</p>
    </div>

    <!-- Add Bug Modal -->
    <div id="addBugModal" class="ui-modal-overlay" style="display: none;">
      <div class="ui-modal">
        <div class="ui-modal-header">
          <span class="ui-modal-title">Report New Bug</span>
          <button class="ui-modal-close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="ui-modal-body">
          <form class="ui-form" id="addBugForm">
            <div class="ui-form-group">
              <label class="ui-form-label">Bug Title</label>
              <input type="text" class="ui-form-input" id="bugTitle" placeholder="Brief, descriptive title" required />
            </div>
            
            <div class="ui-form-group">
              <label class="ui-form-label">Description</label>
              <textarea class="ui-form-input ui-form-textarea" id="bugDescription" placeholder="Detailed description of the bug..." rows="4"></textarea>
            </div>
            
            <div class="ui-form-group">
              <label class="ui-form-label">Priority</label>
              <select class="ui-form-select" id="bugPriority">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="critical">Critical</option>
              </select>
            </div>
            
            <div class="ui-form-group">
              <label class="ui-form-label">Source</label>
              <select class="ui-form-select" id="bugSource">
                <option value="user">User Report</option>
                <option value="testing">Testing/QA</option>
                <option value="monitoring">Monitoring</option>
              </select>
            </div>
            
            <div class="ui-form-group">
              <label class="ui-form-label">Environment</label>
              <select class="ui-form-select" id="bugEnvironment">
                <option value="development">Development</option>
                <option value="staging">Staging</option>
                <option value="production">Production</option>
              </select>
            </div>
          </div>
        </div>
        <div class="ui-modal-footer">
          <button class="ui-btn ui-btn-secondary" data-modal-action="cancel">Cancel</button>
          <button class="ui-btn" id="btnSubmitBug">Report Bug</button>
        </div>
      </div>
    </div>

    <!-- Bug Details Modal -->
    <div id="bugDetailsModal" class="ui-modal-overlay" style="display: none;">
      <div class="ui-modal" style="max-width: 600px;">
        <div class="ui-modal-header">
          <span class="ui-modal-title">Bug Details</span>
          <button class="ui-modal-close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="ui-modal-body" id="bugDetailsContent">
          <!-- Bug details will be rendered here -->
        </div>
        <div class="ui-modal-footer">
          <button class="ui-btn ui-btn-danger" id="btnDeleteBug">
            <i class="fa-solid fa-trash"></i>
            Delete
          </button>
          <button class="ui-btn ui-btn-secondary" id="btnCloseBugDetails">Close</button>
        </div>
      </div>
    </div>

    <!-- Confirm Delete Modal -->
    <div id="confirmDeleteModal" class="ui-modal-overlay" style="display: none;">
      <div class="ui-modal">
        <div class="ui-modal-header">
          <span class="ui-modal-title">Confirm Delete</span>
          <button class="ui-modal-close">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
        <div class="ui-modal-body">
          <p>Are you sure you want to delete this item? This action cannot be undone.</p>
        </div>
        <div class="ui-modal-footer">
          <button class="ui-btn ui-btn-secondary" id="btnCancelDelete">Cancel</button>
          <button class="ui-btn ui-btn-danger" id="btnConfirmDelete">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../components/utils.js"></script>
  <script src="script.js"></script>
</body>
</html>
